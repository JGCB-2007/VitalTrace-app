name: Solicitud de cambio
description: Proponer una funcionalidad o una mejora del flujo.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: Describe el problema que debe resolverse y los roles afectados.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] Criterio verificable 1
        - [ ] Criterio verificable 2
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad sugerida
      options:
        - Crítica
        - Alta
        - Media
        - Baja
    validations:
      required: true

