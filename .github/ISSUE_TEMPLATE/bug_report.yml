name: Reporte de defecto
description: Registrar un comportamiento incorrecto o una regresión.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica el problema de forma clara y sin datos clínicos reales.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Observar...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Adjunta registros o capturas únicamente con datos ficticios.

