name: Security Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitive-files:
    name: Reject sensitive files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject signing keys and credential files
        shell: bash
        run: |
          sensitive_pattern='(^|/)([^/]+\.(jks|keystore)|key\.properties|keystore\.properties)$'
          matches="$(git ls-files | grep -E "$sensitive_pattern" || true)"

          if [[ -n "$matches" ]]; then
            echo "Sensitive files must not be tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Detect private key material
        shell: bash
        run: |
          if git grep -n -I -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .; then
            echo "Private key material detected in tracked files."
            exit 1
          fi

