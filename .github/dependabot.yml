version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Managua
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - android

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Managua
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - ci

